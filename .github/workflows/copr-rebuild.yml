# Rebuild COPR packages (sassech/packages) when upstream or packaging changes.
# COPR "Automatic Build" stays disabled; this workflow decides what to build
# and triggers the COPR custom webhook (secret COPR_WEBHOOK_URL).
# See docs/04-automation.md.
name: COPR rebuild

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC: rebuild packages whose upstream moved
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Package to check (or "all")
        type: string
        default: all
      force:
        description: Rebuild even if the version is unchanged
        type: boolean
        default: false
      dry_run:
        description: Only print decisions, do not call the webhook
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: copr-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed to diff the pushed range

      - name: Check secret
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [[ -z $COPR_WEBHOOK_URL ]]; then
            echo "::error::Secret COPR_WEBHOOK_URL is missing. Set it with: gh secret set COPR_WEBHOOK_URL (see docs/04-automation.md)"
            exit 1
          fi

      - name: Scheduled upstream check
        if: github.event_name == 'schedule'
        run: scripts/check-upstream.sh

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          PACKAGE: ${{ inputs.package }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: scripts/check-upstream.sh "${PACKAGE:-all}"

      - name: Rebuild packages changed by the push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ $BEFORE =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::notice::No usable base commit ($BEFORE): new branch or force-push. Rebuilding nothing; use workflow_dispatch if needed."
            exit 0
          fi
          mapfile -t pkgs < <(git diff --name-only "$BEFORE" "$AFTER" | scripts/check-upstream.sh --changed-files)
          if ((${#pkgs[@]} == 0)); then
            echo "No package, scripts/ or .copr/ changes: nothing to rebuild."
            exit 0
          fi
          echo "Force-rebuilding: ${pkgs[*]}"
          FORCE=1 scripts/check-upstream.sh "${pkgs[@]}"
